name: Verify official catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verifier dependency
        run: python -m pip install beautifulsoup4
      - name: Compare repo snapshot with live official pages
        run: python scripts/verify_official_live.py
      - name: Build site and run full search QA
        run: npm run build
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-verification-report
          path: |
            live-verification.json
            public/qa-report.json
            public/search-qa.json
          if-no-files-found: warn
